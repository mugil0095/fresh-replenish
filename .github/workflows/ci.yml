name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Tiny stand-ins for the batch's outputs, which need the dataset.
      - run: uv run --no-default-groups python tests/dashboard/smoke_data.py data
      - run: docker compose up --wait --wait-timeout 300
      - run: curl -fsS http://localhost:8000/health
      - run: curl -fsS "http://localhost:8000/reorder?store_id=1"
      - run: >-
          curl -fsS -X POST http://localhost:8000/topup -H "content-type: application/json"
          -d '{"store_id": 1, "date": "2024-06-26", "shelf": {"10": 2}}'
      # MLflow has no health check for Compose to wait on: a refused or reset connection means not up yet.
      - run: curl --retry 30 --retry-all-errors --retry-delay 2 -fsS http://localhost:5000/health
      - run: curl -fsS http://localhost:8501/_stcore/health
      # That health check doesn't run the page, so open it with Streamlit's test runner.
      - run: >-
          docker compose exec -T dashboard python -c
          "from streamlit.testing.v1 import AppTest;
          app = AppTest.from_file('/app/src/fresh_replenish/dashboard/app.py', default_timeout=120).run();
          assert not app.exception and not app.error and len(app.tabs) == 5, app"
      - if: failure()
        run: docker compose logs
