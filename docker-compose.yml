# `docker compose up`: the reorder API on :8000 and the MLflow UI on :5000.
# Run the nightly batch on the host first: it writes data/processed/orders.parquet and mlruns/.
services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data/processed:/app/data/processed:ro
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.2
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlruns/mlflow.db
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
