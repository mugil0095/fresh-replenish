[project]
name = "fresh-replenish"
version = "0.1.0"
description = "Fresh-food replenishment for quick-commerce dark stores: hidden-demand recovery, foundation-model forecasts, cost-based orders and an AI agent."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb",
    "huggingface_hub",
    "pandas",
    "pyarrow",
    "pyfixest>=0.60.0",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fresh_replenish"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: needs the downloaded FreshRetailNet-50K files in data/raw"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
