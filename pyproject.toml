[project]
name = "fresh-replenish"
version = "0.1.0"
description = "Fresh-food replenishment for quick-commerce dark stores: hidden-demand recovery, foundation-model forecasts, cost-based orders and an AI agent."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb",
    "huggingface_hub",
    "pandas",
    "pyarrow",
]

[dependency-groups]
dev = ["httpx", "pytest", "ruff"]
# Models, statistics and experiment tracking: everything the batch job and the analyses need.
ml = [
    "chronos-forecasting>=2.3",
    "lightgbm>=4.7",
    "mlflow>=3",
    "pyfixest>=0.60.0",
    "pypots>=1.5",
    "scipy",
    "timesfm[torch]>=3.0",
    "torch>=2.14,<2.15",
    "toto-2>=2.0",
]
# The API only: the Docker image installs this group and nothing heavy.
serve = ["fastapi", "uvicorn"]
# The Streamlit dashboard (Altair charts come with Streamlit).
dashboard = ["streamlit"]
# The replenishment agent, with the chosen LLM providers: Gemini and Ollama Cloud.
agent = [
    "langchain>=1.4",
    "langchain-google-genai",
    "langchain-ollama",
    "langgraph>=1.2",
    "python-dotenv",
    "truststore>=0.10.5",
]

[tool.uv]
default-groups = ["dev", "ml", "serve", "agent", "dashboard"]
# pypots caps transformers at 4.57.6; without a floor uv backtracks to 4.12, which needs Rust to build.
constraint-dependencies = ["transformers>=4.40"]

# CUDA 12.6 builds still support the GTX 1650 (sm_75); CI on Linux gets the small CPU build.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fresh_replenish"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "data: needs the downloaded FreshRetailNet-50K files in data/raw",
    "models: needs the foundation-model weights in the Hugging Face cache",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
